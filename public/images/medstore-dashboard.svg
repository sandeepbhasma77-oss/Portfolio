<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MedStore Inventory Management System dashboard</title>
  <desc id="desc">Dashboard showing medicine inventory, stock quantities, sales, restocking and invoice summary.</desc>
